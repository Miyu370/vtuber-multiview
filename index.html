<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VTuber MultiView</title>
<style>
:root{--bg:#0d1017;--panel:#171b25;--panel2:#202634;--line:#30384a;--text:#f7f8fb;--muted:#aeb6c7;--accent:#8b7cff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:1600px;margin:auto;padding:18px}.head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;gap:11px;align-items:center}.logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#8b7cff,#69e0d0);display:grid;place-items:center;color:#10131c;font-weight:900}
h1{font-size:19px;margin:0}.sub{font-size:13px;color:var(--muted);margin-top:3px}.bar{display:grid;grid-template-columns:1fr auto auto;gap:8px;padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:15px}
input,select,button{font:inherit}input,select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:#10141d;color:var(--text);padding:0 12px;outline:none}
button{min-height:42px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:8px 12px;cursor:pointer}button:hover{border-color:#59657c}.primary{background:var(--accent);border-color:var(--accent)}
.tools{display:flex;gap:8px;flex-wrap:wrap}.info{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:13px;padding:10px 2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.grid.one{grid-template-columns:1fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{background:var(--panel);border:1px solid var(--line);border-radius:15px;overflow:hidden;min-width:0}.video{aspect-ratio:16/9;background:#080a0f}.video iframe{display:block;width:100%;height:100%;border:0}
.empty{aspect-ratio:16/7;display:grid;place-items:center;text-align:center;color:var(--muted);background:radial-gradient(circle at 30% 20%,rgba(139,124,255,.15),transparent 30%),#0b0e14}.empty b{display:block;color:var(--text);margin-bottom:6px}
.cardbar{display:flex;align-items:center;gap:7px;flex-wrap:wrap;padding:9px}.title{font-weight:700;flex:1;min-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.on{border-color:var(--accent);background:rgba(139,124,255,.15)}.focus{grid-column:1/-1}.focus .video{aspect-ratio:16/8}
.note{margin-top:14px;color:var(--muted);font-size:12px;line-height:1.6}.danger{color:#ffd8df}
@media(max-width:850px){.bar{grid-template-columns:1fr}.grid,.grid.three{grid-template-columns:1fr}.focus .video{aspect-ratio:16/9}}
</style>
</head>
<body>
<div class="app">
<header class="head">
 <div class="brand"><div class="logo">MV</div><div><h1>VTuber MultiView</h1><div class="sub">YouTube配信を最大4枠で同時視聴</div></div></div>
 <div class="tools"><button id="solo">🎧 選択枠だけ音声</button><button id="muteAll">🔇 全ミュート</button><button id="clear" class="danger">全枠クリア</button></div>
</header>
<section class="bar">
 <input id="url" type="url" placeholder="YouTube URLを貼り付け">
 <button id="add" class="primary">＋ 配信を追加</button>
 <select id="layout"><option value="auto">自動レイアウト</option><option value="one">1列</option><option value="two">2列</option><option value="three">3列</option></select>
</section>
<div class="info"><span id="count">0 / 4 枠</span><span>枠をクリックすると「選択枠」になります</span></div>
<main id="grid" class="grid"></main>
<p class="note">※ YouTube側で埋め込みが許可されていない動画は、このサイトでも再生できません。ブラウザの自動再生制限により追加直後はミュート状態です。</p>
</div>
<script>
const MAX=4, grid=document.getElementById('grid'), url=document.getElementById('url'), layout=document.getElementById('layout');
let items=[], selected=null, focused=null;
function idFrom(v){try{let u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0];if(u.hostname.includes('youtube.com')){if(u.pathname==='/watch')return u.searchParams.get('v');let p=u.pathname.split('/').filter(Boolean);if(['live','shorts','embed'].includes(p[0]))return p[1]}}catch(e){}return /^[\w-]{11}$/.test(v.trim())?v.trim():null}
function uid(){return (crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random())}
function save(){localStorage.setItem('vtmv2',JSON.stringify(items))}
function load(){try{items=JSON.parse(localStorage.getItem('vtmv2')||'[]').slice(0,MAX)}catch(e){items=[]}}
function command(id,fn){let f=document.getElementById('f-'+id);if(f?.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:[]}),'*')}
function setMute(id,m){let x=items.find(i=>i.id===id);if(!x)return;x.muted=m;command(id,m?'mute':'unMute');save();controls()}
function controls(){document.querySelectorAll('.card').forEach(c=>{let x=items.find(i=>i.id===c.dataset.id);if(!x)return;c.style.outline=selected===x.id?'2px solid var(--accent)':'none';let b=c.querySelector('.mute');b.textContent=x.muted?'🔇 ミュート':'🔊 音声ON';b.classList.toggle('on',!x.muted)})}
function render(){
 grid.className='grid'+(layout.value==='one'?' one':layout.value==='three'?' three':'');
 grid.innerHTML='';
 if(!items.length)grid.innerHTML='<div class="card" style="grid-column:1/-1"><div class="empty"><div><b>YouTube URLを貼って配信を追加</b>最大4枠まで表示できます</div></div></div>';
 items.forEach((x,n)=>{let c=document.createElement('section');c.className='card'+(focused===x.id?' focus':'');c.dataset.id=x.id;
 c.innerHTML=`<div class="video"><iframe id="f-${x.id}" src="https://www.youtube-nocookie.com/embed/${x.vid}?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0" title="YouTube配信 ${n+1}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div><div class="cardbar"><div class="title">配信 #${n+1}</div><button class="mute">${x.muted?'🔇 ミュート':'🔊 音声ON'}</button><button class="only">🎧 この枠だけ</button><button class="big">${focused===x.id?'↩ 戻す':'⛶ 集中'}</button><button class="del danger">✕</button></div>`;
 c.addEventListener('click',()=>{selected=x.id;controls()});
 c.querySelector('.mute').onclick=e=>{e.stopPropagation();setMute(x.id,!x.muted)};
 c.querySelector('.only').onclick=e=>{e.stopPropagation();selected=x.id;items.forEach(i=>setMute(i.id,i.id!==x.id))};
 c.querySelector('.big').onclick=e=>{e.stopPropagation();focused=focused===x.id?null:x.id;selected=x.id;render()};
 c.querySelector('.del').onclick=e=>{e.stopPropagation();items=items.filter(i=>i.id!==x.id);if(selected===x.id)selected=items[0]?.id||null;if(focused===x.id)focused=null;save();render()};
 grid.appendChild(c)});
 document.getElementById('count').textContent=`${items.length} / ${MAX} 枠`;controls()
}
function add(){let v=url.value.trim(),vid=idFrom(v);if(!vid)return alert('YouTubeのURLを確認してね');if(items.length>=MAX)return alert('最大4枠までだよ');if(items.some(i=>i.vid===vid))return alert('その配信は追加済みだよ');let x={id:uid(),vid,url:v,muted:true};items.push(x);selected=x.id;url.value='';save();render()}
document.getElementById('add').onclick=add;url.addEventListener('keydown',e=>{if(e.key==='Enter')add()});layout.onchange=render;
document.getElementById('muteAll').onclick=()=>items.forEach(i=>setMute(i.id,true));
document.getElementById('solo').onclick=()=>{let id=selected||items[0]?.id;if(!id)return;items.forEach(i=>setMute(i.id,i.id!==id))};
document.getElementById('clear').onclick=()=>{if(items.length&&confirm('すべての配信枠を消しますか？')){items=[];selected=focused=null;save();render()}};
load();selected=items[0]?.id||null;render();
</script>
</body>
</html>
