<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VTuber MultiView Ver.4</title>
<style>
:root{
  --bg:#090c12;--panel:#141922;--panel2:#1d2430;--line:#2b3444;
  --text:#f7f8fb;--muted:#aeb6c7;--accent:#8b7cff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans JP",sans-serif}
body{min-height:100vh}
.app{max-width:1800px;margin:auto;padding:12px}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.brand{display:flex;gap:10px;align-items:center}.logo{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#8b7cff,#69e0d0);display:grid;place-items:center;color:#10131c;font-weight:900}
h1{font-size:18px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}
.bar{display:grid;grid-template-columns:1fr auto auto;gap:7px;padding:8px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
input,select,button{font:inherit}
input,select{min-height:38px;border:1px solid var(--line);border-radius:9px;background:#0f131b;color:var(--text);padding:0 10px;outline:none}
button{min-height:36px;border:1px solid var(--line);border-radius:9px;background:var(--panel2);color:var(--text);padding:6px 10px;cursor:pointer}
button:hover{border-color:#59657c}.primary{background:var(--accent);border-color:var(--accent)}
.tools,.modebar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.modebar{margin:7px 0}
.modebar .active{border-color:var(--accent);background:rgba(139,124,255,.15)}
.info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:5px 1px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
.grid.one{grid-template-columns:1fr}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.video{aspect-ratio:16/9;background:#080a0f}.video iframe{display:block;width:100%;height:100%;border:0}
.empty{aspect-ratio:16/7;display:grid;place-items:center;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--text);margin-bottom:5px}
.overlaybar{
  position:absolute;left:6px;right:6px;bottom:6px;display:flex;gap:5px;align-items:center;
  padding:5px;border-radius:9px;background:rgba(8,11,16,.72);backdrop-filter:blur(5px);
  opacity:.22;transition:.18s ease;z-index:3;
}
.card:hover .overlaybar,.card:focus-within .overlaybar{opacity:1}
.overlaybar .title{font-size:11px;font-weight:700;flex:1;min-width:30px}
.overlaybar button{min-height:28px;padding:2px 7px;font-size:11px;background:rgba(28,35,47,.92)}
.on{border-color:var(--accent);background:rgba(139,124,255,.22)!important}
.focus{grid-column:1/-1}.focus .video{aspect-ratio:16/8.2}
.note{margin-top:8px;color:var(--muted);font-size:11px;line-height:1.5}.danger{color:#ffd8df}
.badge{font-size:11px;padding:4px 7px;border:1px solid var(--line);border-radius:999px;color:var(--muted)}

/* compact */
body.compact .app{padding:5px}
body.compact .head{margin-bottom:5px}
body.compact .logo{width:30px;height:30px;border-radius:8px}
body.compact h1{font-size:15px}
body.compact .sub{display:none}
body.compact .bar{padding:4px;border-radius:6px}
body.compact .grid{gap:3px}
body.compact .card{border-radius:4px}
body.compact .note{display:none}

/* immersive-fit */
body.immersive{overflow:hidden}
body.immersive .app{
  max-width:none;width:100%;height:100vh;padding:0;display:flex;flex-direction:column;overflow:hidden
}
body.immersive .head{display:none}
body.immersive .bar{
  flex:0 0 auto;grid-template-columns:1fr auto auto;padding:3px;border-radius:0;border-left:0;border-right:0;border-top:0
}
body.immersive .bar input,body.immersive .bar select,body.immersive .bar button{min-height:30px;font-size:12px}
body.immersive .modebar{
  flex:0 0 auto;margin:2px 3px;gap:4px;min-height:28px
}
body.immersive .modebar button,body.immersive .modebar select{min-height:27px;font-size:11px;padding:2px 6px}
body.immersive .info,body.immersive .note{display:none}
body.immersive .grid{
  flex:1 1 auto;min-height:0;gap:1px;grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr));
}
body.immersive .card{
  border-radius:0;border-color:#111720;height:100%;min-height:0
}
body.immersive .video{width:100%;height:100%;aspect-ratio:auto}
body.immersive .video iframe{width:100%;height:100%;object-fit:contain}
body.immersive .focus{grid-column:1/-1;grid-row:1/-1}
body.immersive .overlaybar{
  left:4px;right:4px;bottom:4px;padding:3px;gap:3px;border-radius:7px;opacity:.08
}
body.immersive .card:hover .overlaybar,body.immersive .card:focus-within .overlaybar{opacity:1}
body.immersive .overlaybar .title{font-size:10px}
body.immersive .overlaybar button{min-height:24px;padding:1px 6px;font-size:10px}
body.immersive .empty{height:100%;aspect-ratio:auto}

/* fewer than 4 items should still look reasonable */
body.immersive .grid.count-1{grid-template-columns:1fr;grid-template-rows:1fr}
body.immersive .grid.count-2{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:1fr}
body.immersive .grid.count-3{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(0,1fr))}
body.immersive .grid.count-3 .card:first-child{grid-row:1/-1}

@media(max-width:850px){
  .bar{grid-template-columns:1fr}
  .grid,.grid.three{grid-template-columns:1fr}
  body.immersive{overflow:auto}
  body.immersive .app{height:auto;overflow:visible}
  body.immersive .grid,
  body.immersive .grid.count-1,
  body.immersive .grid.count-2,
  body.immersive .grid.count-3{
    display:grid;grid-template-columns:1fr;grid-template-rows:auto
  }
  body.immersive .grid.count-3 .card:first-child{grid-row:auto}
  body.immersive .video{height:auto;aspect-ratio:16/9}
}
</style>
</head>
<body>
<div class="app">
<header class="head">
  <div class="brand">
    <div class="logo">MV</div>
    <div><h1>VTuber MultiView <span class="badge">Ver.4</span></h1><div class="sub">4窓を画面内にフィットする没入表示</div></div>
  </div>
  <div class="tools">
    <button id="solo">🎧 選択枠だけ音声</button>
    <button id="muteAll">🔇 全ミュート</button>
    <button id="clear" class="danger">全枠クリア</button>
  </div>
</header>

<section class="bar">
  <input id="url" type="url" placeholder="YouTube URLを貼り付け">
  <button id="add" class="primary">＋ 配信を追加</button>
  <select id="layout">
    <option value="auto">自動レイアウト</option>
    <option value="one">1列</option>
    <option value="two">2列</option>
    <option value="three">3列</option>
  </select>
</section>

<div class="modebar">
  <button data-ui="normal" class="uiBtn active">通常</button>
  <button data-ui="compact" class="uiBtn">コンパクト</button>
  <button data-ui="immersive" class="uiBtn">没入フィット</button>
  <select id="embedMode">
    <option value="normal">通常YouTube埋め込み</option>
    <option value="privacy">プライバシー強化版</option>
  </select>
</div>

<div class="info">
  <span id="count">0 / 4 枠</span>
  <span>没入フィットでは4窓をブラウザ表示領域に収めます</span>
</div>

<main id="grid" class="grid"></main>

<p class="note">
※ 没入フィット時の操作バーは動画上に重なり、普段は薄く表示されます。<br>
※ 「▶ YouTube」は通常のYouTubeページを新しいタブで開きます。
</p>
</div>

<script>
const MAX=4;
const grid=document.getElementById('grid'),url=document.getElementById('url'),layout=document.getElementById('layout'),embedMode=document.getElementById('embedMode');
let items=[],selected=null,focused=null,uiMode='normal';

function idFrom(v){
  try{
    const u=new URL(v);
    if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0];
    if(u.hostname.includes('youtube.com')){
      if(u.pathname==='/watch')return u.searchParams.get('v');
      const p=u.pathname.split('/').filter(Boolean);
      if(['live','shorts','embed'].includes(p[0]))return p[1];
    }
  }catch(e){}
  return /^[\w-]{11}$/.test(v.trim())?v.trim():null;
}
function uid(){return (crypto.randomUUID&&crypto.randomUUID())||String(Date.now()+Math.random())}
function save(){
  localStorage.setItem('vtmv4_items',JSON.stringify(items));
  localStorage.setItem('vtmv4_mode',embedMode.value);
  localStorage.setItem('vtmv4_ui',uiMode);
}
function load(){
  try{items=JSON.parse(localStorage.getItem('vtmv4_items')||'[]').slice(0,MAX)}catch(e){items=[]}
  embedMode.value=localStorage.getItem('vtmv4_mode')||'normal';
  uiMode=localStorage.getItem('vtmv4_ui')||'normal';
  applyUi();
}
function applyUi(){
  document.body.classList.remove('compact','immersive');
  if(uiMode==='compact')document.body.classList.add('compact');
  if(uiMode==='immersive')document.body.classList.add('immersive');
  document.querySelectorAll('.uiBtn').forEach(b=>b.classList.toggle('active',b.dataset.ui===uiMode));
}
function command(id,fn){
  const f=document.getElementById('f-'+id);
  if(f?.contentWindow)f.contentWindow.postMessage(JSON.stringify({event:'command',func:fn,args:[]}),'*');
}
function setMute(id,m){
  const x=items.find(i=>i.id===id);if(!x)return;
  x.muted=m;command(id,m?'mute':'unMute');save();controls();
}
function controls(){
  document.querySelectorAll('.card').forEach(c=>{
    const x=items.find(i=>i.id===c.dataset.id);if(!x)return;
    c.style.outline=selected===x.id?'2px solid var(--accent)':'none';
    const b=c.querySelector('.mute');
    b.textContent=x.muted?'🔇':'🔊';
    b.classList.toggle('on',!x.muted);
  });
}
function embedBase(){return embedMode.value==='privacy'?'https://www.youtube-nocookie.com/embed/':'https://www.youtube.com/embed/'}
function render(){
  grid.className='grid count-'+items.length+(layout.value==='one'?' one':layout.value==='three'?' three':'');
  grid.innerHTML='';
  if(!items.length){
    grid.innerHTML='<div class="card" style="grid-column:1/-1"><div class="empty"><div><b>YouTube URLを貼って配信を追加</b>最大4枠まで表示できます</div></div></div>';
  }
  items.forEach((x,n)=>{
    const c=document.createElement('section');
    c.className='card'+(focused===x.id?' focus':'');
    c.dataset.id=x.id;
    const watch='https://www.youtube.com/watch?v='+encodeURIComponent(x.vid);
    c.innerHTML=`
      <div class="video">
        <iframe id="f-${x.id}" src="${embedBase()}${x.vid}?autoplay=1&mute=1&enablejsapi=1&playsinline=1&rel=0"
          title="YouTube配信 ${n+1}" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>
      </div>
      <div class="overlaybar">
        <div class="title">#${n+1}</div>
        <button class="open" title="YouTubeで開く">▶ YouTube</button>
        <button class="mute" title="ミュート切替">${x.muted?'🔇':'🔊'}</button>
        <button class="only" title="この枠だけ音声">🎧</button>
        <button class="big" title="集中表示">${focused===x.id?'↩':'⛶'}</button>
        <button class="del danger" title="削除">✕</button>
      </div>`;
    c.addEventListener('click',()=>{selected=x.id;controls()});
    c.querySelector('.open').onclick=e=>{e.stopPropagation();window.open(watch,'_blank','noopener,noreferrer')};
    c.querySelector('.mute').onclick=e=>{e.stopPropagation();setMute(x.id,!x.muted)};
    c.querySelector('.only').onclick=e=>{e.stopPropagation();selected=x.id;items.forEach(i=>setMute(i.id,i.id!==x.id))};
    c.querySelector('.big').onclick=e=>{e.stopPropagation();focused=focused===x.id?null:x.id;selected=x.id;render()};
    c.querySelector('.del').onclick=e=>{e.stopPropagation();items=items.filter(i=>i.id!==x.id);if(selected===x.id)selected=items[0]?.id||null;if(focused===x.id)focused=null;save();render()};
    grid.appendChild(c);
  });
  document.getElementById('count').textContent=`${items.length} / ${MAX} 枠`;
  controls();
}
function add(){
  const v=url.value.trim(),vid=idFrom(v);
  if(!vid)return alert('YouTubeのURLを確認してね');
  if(items.length>=MAX)return alert('最大4枠までだよ');
  if(items.some(i=>i.vid===vid))return alert('その配信は追加済みだよ');
  const x={id:uid(),vid,url:v,muted:true};
  items.push(x);selected=x.id;url.value='';save();render();
}
document.getElementById('add').onclick=add;
url.addEventListener('keydown',e=>{if(e.key==='Enter')add()});
layout.onchange=render;
embedMode.onchange=()=>{save();render()};
document.getElementById('muteAll').onclick=()=>items.forEach(i=>setMute(i.id,true));
document.getElementById('solo').onclick=()=>{
  const id=selected||items[0]?.id;if(!id)return;
  items.forEach(i=>setMute(i.id,i.id!==id));
};
document.getElementById('clear').onclick=()=>{
  if(items.length&&confirm('すべての配信枠を消しますか？')){
    items=[];selected=focused=null;save();render();
  }
};
document.querySelectorAll('.uiBtn').forEach(b=>b.onclick=()=>{
  uiMode=b.dataset.ui;applyUi();save();render();
});
load();
selected=items[0]?.id||null;
render();
</script>
</body>
</html>
